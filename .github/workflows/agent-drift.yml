name: Agent drift
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: agent-drift-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  agent-drift:
    uses: BehindTheMusicTree/github-workflows/.github/workflows/agent-drift.yml@8b10f1dfcb88a245e4e4256e61164b49e595faea # v6.5.0
    permissions:
      contents: read
