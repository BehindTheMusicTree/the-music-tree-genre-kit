name: Agent drift
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: agent-drift-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  agent-drift:
    uses: BehindTheMusicTree/github-workflows/.github/workflows/agent-drift.yml@9b5de918c697e4b0cb04201f6df36c861ec81fbe # v6.3.0
    permissions:
      contents: read
