name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Check the graph version satisfies the kit dependency range
        # uv does not compare a workspace member's version with the specifier
        # declared by its dependents, so a graph bump can leave the range silently.
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import sys, tomllib
          from packaging.requirements import Requirement
          root = tomllib.load(open("pyproject.toml", "rb"))
          graph = tomllib.load(open("packages/genre-graph/pyproject.toml", "rb"))["project"]
          reqs = [Requirement(d) for d in root["project"]["dependencies"]]
          req = next(r for r in reqs if r.name == graph["name"])
          if not req.specifier.contains(graph["version"], prereleases=True):
              sys.exit(f"graph {graph['version']} is outside the kit range '{req.specifier}'")
          print(f"graph {graph['version']} satisfies '{req.specifier}'")
          PY

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src packages/genre-graph/src

  migration-check:
    name: Fixture makemigrations check
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
      PYTHONPATH: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: makemigrations --check
        run: uv run django-admin makemigrations fixture_app the_music_tree_genre_kit --check --dry-run

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run pytest
        run: uv run pytest --cov-branch --cov-report=xml:coverage-sqlite.xml --cov-fail-under=0

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pytest
          path: coverage-sqlite.xml
          if-no-files-found: error

  pytest-postgres:
    name: Pytest PostgreSQL (${{ matrix.driver.name }})
    strategy:
      fail-fast: false
      matrix:
        driver:
          - name: psycopg3
            dependency: psycopg[binary]
          - name: psycopg2
            dependency: psycopg2-binary==2.9.11
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: graph_test
          POSTGRES_PASSWORD: graph_test
          POSTGRES_DB: graph_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graph_test -d graph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_DATABASE: graph_test
      POSTGRES_TEST_USER: graph_test
      POSTGRES_TEST_HOST: 127.0.0.1
      POSTGRES_TEST_PORT: "5432"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run pytest on PostgreSQL
        # Covers the PostgreSQL-only paths; the coverage job merges this report with the SQLite one.
        run: >-
          uv run --with '${{ matrix.driver.dependency }}' pytest
          --ds=tests.postgres_settings --create-db --cov-branch
          --cov-report=xml:coverage-postgres-${{ matrix.driver.name }}.xml --cov-fail-under=0

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-postgres-${{ matrix.driver.name }}
          path: coverage-postgres-${{ matrix.driver.name }}.xml
          if-no-files-found: error

  pure-graph:
    name: Pure graph Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build pure graph distributions
        run: uv build --package the-music-tree-genre-graph --out-dir dist/genre-graph

      - name: Build Django kit distributions
        if: matrix.python == '3.14'
        run: uv build --package the-music-tree-genre-kit --out-dir dist/kit

      - name: Test distributions outside the workspace
        run: bash scripts/check-graph-distributions.sh '${{ matrix.python }}'

  coverage:
    needs: [pytest, pytest-postgres]
    permissions:
      contents: read
    uses: BehindTheMusicTree/github-workflows/.github/workflows/coverage.yml@18b90bc9c64b9abab0a86e7ea74f65acac93aec1 # v6.6.0
    with:
      line: 85

  tests-success:
    name: Tests success
    if: always()
    needs: [pytest, pytest-postgres, pure-graph, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: All test jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS"
