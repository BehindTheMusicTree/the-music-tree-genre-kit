[project]
name = "the-music-tree-genre-kit"
version = "0.1.0"
description = "Shared genre/tag/criteria/tree Django library for hear-the-music-tree-api and grow-the-music-tree-api"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "mignot", email = "garcia.andreas.1991@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==1.18.2",
    "pytest==8.1.1",
    "ruff==0.15.9",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
# Shared rule set vendored from hear-the-music-tree-api/baselines/ruff.toml.
extend = "baselines/ruff.toml"

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
